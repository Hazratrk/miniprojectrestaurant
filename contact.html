<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Ferrero Restaurant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-100">
    <header class="bg-amber-900 text-white p-4">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold">Ferrero Restaurant</h1>
            <nav>
                <ul class="flex space-x-6">
                    <li><a href="index.html" class="hover:text-amber-200">Home</a></li>
                    <li><a href="menu.html" class="hover:text-amber-200">Menu</a></li>
                    <li><a href="about.html" class="hover:text-amber-200">About</a></li>
                    <li><a href="contact.html" class="hover:text-amber-200">Contact</a></li>
                    <li id="loginNavItem"><a href="login.html" class="hover:text-amber-200">Login</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container mx-auto p-6">
        <h2 class="text-3xl font-bold mb-8 text-amber-800">Contact Us</h2>
        
        <div class="grid md:grid-cols-2 gap-8">
            <div class="bg-white p-6 rounded-lg shadow-md">
                <h3 class="text-xl font-semibold mb-4 text-amber-700">Get in Touch</h3>
                <form>
                    <div class="mb-4">
                        <label class="block text-gray-700 mb-2" for="name">Name</label>
                        <input type="text" id="name" class="w-full p-2 border border-gray-300 rounded">
                    </div>
                    <div class="mb-4">
                        <label class="block text-gray-700 mb-2" for="email">Email</label>
                        <input type="email" id="email" class="w-full p-2 border border-gray-300 rounded">
                    </div>
                    <div class="mb-4">
                        <label class="block text-gray-700 mb-2" for="message">Message</label>
                        <textarea id="message" rows="4" class="w-full p-2 border border-gray-300 rounded"></textarea>
                    </div>
                    <button type="submit" class="bg-amber-700 text-white px-4 py-2 rounded hover:bg-amber-800">Send Message</button>
                </form>
            </div>
            
            <div class="bg-white p-6 rounded-lg shadow-md">
                <h3 class="text-xl font-semibold mb-4 text-amber-700">Our Information</h3>
                <div class="space-y-4">
                    <div class="flex items-start">
                        <i class="fas fa-map-marker-alt text-amber-600 mt-1 mr-3"></i>
                        <p>Nizami Street AF BUSSINES HOUSE</p>
                    </div>
                    <div class="flex items-center">
                        <i class="fas fa-phone text-amber-600 mr-3"></i>
                        <p>+994 (50)211-64-02</p>
                    </div>
                    <div class="flex items-center">
                        <i class="fas fa-envelope text-amber-600 mr-3"></i>
                        <p>info@ferrero-restaurant.com</p>
                    </div>
                    <div class="flex items-center">
                        <i class="fas fa-clock text-amber-600 mr-3"></i>
                        <p>Open daily: 10:00 AM - 11:00 PM</p>
                    </div>
                </div>
                
                <div class="mt-6">
                    <h4 class="font-semibold mb-2">Follow Us</h4>
                    <div class="flex space-x-4">
                        <a href="#" class="text-amber-600 hover:text-amber-800"><i class="fab fa-facebook-f text-xl"></i></a>
                        <a href="#" class="text-amber-600 hover:text-amber-800"><i class="fab fa-instagram text-xl"></i></a>
                        <a href="#" class="text-amber-600 hover:text-amber-800"><i class="fab fa-twitter text-xl"></i></a>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const user = JSON.parse(localStorage.getItem('loggedInUser'));
            const loginNavItem = document.getElementById('loginNavItem');
            
            if (user && loginNavItem) {
               
                loginNavItem.remove();
                
              
                const nav = document.querySelector('nav ul');
                const profileLi = document.createElement('li');
                const profileLink = document.createElement('a');
                profileLink.href = 'profile.html';
                profileLink.className = 'hover:text-amber-200';
                profileLink.textContent = `Welcome, ${user.username}`;
                profileLi.appendChild(profileLink);
                nav.appendChild(profileLi);
                
               
                
                const logoutLi = document.createElement('li');
                const logoutLink = document.createElement('a');
                logoutLink.href = '#';
                logoutLink.className = 'hover:text-amber-200';
                logoutLink.textContent = 'Logout';
                logoutLink.addEventListener('click', function(e) {
                    e.preventDefault();
                    localStorage.removeItem('loggedInUser');
                    window.location.href = 'index.html';
                });
                logoutLi.appendChild(logoutLink);
                nav.appendChild(logoutLi);
            }
        });
    </script>
    <footer class="bg-amber-900 text-white p-6 mt-12">
        <div class="container mx-auto text-center">
            <p>© 2025 Ferrero Restaurant. All rights reserved.</p>
        </div>
    </footer>
    <script src="js/auth.js"></script>
    
</body>
</html>
