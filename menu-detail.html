<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dish Details - Ferrero Restaurant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-gray-100">
    <header class="bg-amber-900 text-white p-4">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold">Ferrero Restaurant</h1>
            <nav>
                <ul class="flex space-x-6">
                    <li><a href="index.html" class="nav-link">Home</a></li>
                    <li><a href="menu.html" class="nav-link">Menu</a></li>
                    <li><a href="about.html" class="nav-link">About</a></li>
                    <li><a href="contact.html" class="nav-link">Contact</a></li>
                    <li id="authNavItem"><a href="login.html" class="nav-link">Login</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container mx-auto p-6">
        <div class="bg-white rounded-lg shadow-lg overflow-hidden">
            <div class="md:flex">
                <div class="md:w-1/2">
                    <img id="dishImage" src="" alt="Dish Image" class="w-full h-full object-cover">
                </div>
                <div class="p-8 md:w-1/2">
                    <h2 id="dishName" class="text-3xl font-bold mb-4 text-amber-800"></h2>
                    <p id="dishPrice" class="text-2xl font-bold text-amber-700 mb-6"></p>
                    
                    <div class="mb-6">
                        <h3 class="text-xl font-semibold mb-2 text-amber-700">Description</h3>
                        <p id="dishDescription" class="text-gray-700"></p>
                    </div>
                    
                    <div class="mb-6">
                        <h3 class="text-xl font-semibold mb-2 text-amber-700">Ingredients</h3>
                        <ul id="dishIngredients" class="list-disc pl-5 text-gray-700"></ul>
                    </div>
                    
                    <div class="mb-6">
                        <h3 class="text-xl font-semibold mb-2 text-amber-700">Nutritional Info</h3>
                        <div class="grid grid-cols-2 gap-4 text-sm">
                            <div class="nutrition-info">
                                <span class="font-semibold">Calories:</span> <span id="calories"></span>
                            </div>
                            <div class="nutrition-info">
                                <span class="font-semibold">Protein:</span> <span id="protein"></span>
                            </div>
                            <div class="nutrition-info">
                                <span class="font-semibold">Carbs:</span> <span id="carbs"></span>
                            </div>
                            <div class="nutrition-info">
                                <span class="font-semibold">Fat:</span> <span id="fat"></span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="flex items-center space-x-4">
                        <div class="flex items-center border rounded">
                            <button class="quantity-btn" id="decreaseQty">-</button>
                            <span class="px-3" id="quantity">1</span>
                            <button class="quantity-btn" id="increaseQty">+</button>
                        </div>
                        <button id="addToCart" class="btn-primary flex items-center">
                            <i class="fas fa-shopping-cart mr-2"></i> Add to Cart
                        </button>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="mt-12">
            <h3 class="text-2xl font-bold mb-6 text-amber-800">You Might Also Like</h3>
            <div class="grid md:grid-cols-3 gap-6" id="relatedDishes">
                <!-- Related dishes will be loaded from detail.js -->
            </div>
        </div>
    </main>

    <footer class="bg-amber-900 text-white p-8">
        <div class="container mx-auto text-center">
            <p>&copy; 2023 Ferrero Restaurant. All rights reserved.</p>
        </div>
    </footer>
<script type="module" src="./pages/menu.js"></script>
    
</body>
</html>
