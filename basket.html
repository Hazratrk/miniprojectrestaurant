<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Your Basket - Ferrero Restaurant</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"/>
  <link rel="stylesheet" href="css/styles.css"/>
</head>
<body class="bg-gray-100">
  <header class="bg-amber-900 text-white p-4">
    <div class="container mx-auto flex justify-between items-center">
      <h1 class="text-2xl font-bold">Ferrero Restaurant</h1>
      <nav>
        <ul class="flex space-x-6">
          <li><a href="index.html" class="nav-link">Home</a></li>
          <li><a href="menu.html" class="nav-link">Menu</a></li>
          <li><a href="about.html" class="nav-link">About</a></li>
          <li><a href="contact.html" class="nav-link">Contact</a></li>
          <li id="authNavItem"><a href="login.html" class="nav-link">Login</a></li>
          <li>
            <a href="basket.html" class="flex items-center text-amber-400 font-semibold">
              <i class="fas fa-shopping-basket mr-1"></i>
              <span id="basketCount">0</span>
            </a>
          </li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container mx-auto p-6">
    <h2 class="text-3xl font-bold mb-8 text-amber-800">Your Basket</h2>
    
    <div id="basketContainer" class="bg-white rounded-lg shadow-md p-6 mb-8">
      <p id="emptyBasketMessage" class="text-center py-8 text-gray-600 hidden">Your basket is empty</p>
      <div id="basketItems"></div>
    </div>

    <div class="bg-white rounded-lg shadow-md p-6">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-xl font-semibold">Order Summary</h3>
      </div>
      <div class="space-y-3 mb-6">
        <div class="flex justify-between">
          <span>Subtotal:</span>
          <span id="subtotal">$0.00</span>
        </div>
        <div class="flex justify-between">
          <span>Delivery Fee:</span>
          <span>$2.50</span>
        </div>
        <div class="flex justify-between border-t pt-3 font-bold text-lg">
          <span>Total:</span>
          <span id="total">$2.50</span>
        </div>
      </div>
      <button id="checkoutBtn" class="bg-amber-700 hover:bg-amber-800 text-white font-semibold rounded-lg w-full py-3 text-lg transition">
        Proceed to Checkout
      </button>
    </div>
  </main>

  <footer class="bg-amber-900 text-white p-8">
    <div class="container mx-auto text-center">
      <p>&copy; 2025 Ferrero Restaurant. All rights reserved.</p>
    </div>
  </footer>

  <script type="module" src="./pages/auth.js"></script>
  <script type="module" src="./pages/basket.js"></script>
</body>
</html>
