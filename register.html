<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Ferrero Restaurant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-gray-100">
    <header class="bg-amber-900 text-white p-4">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold">Ferrero Restaurant</h1>
            <nav>
                <ul class="flex space-x-6">
                    <li><a href="index.html" class="nav-link">Home</a></li>
                    <li><a href="menu.html" class="nav-link">Menu</a></li>
                    <li><a href="about.html" class="nav-link">About</a></li>
                    <li><a href="contact.html" class="nav-link">Contact</a></li>
                    <li id="authNavItem"><a href="login.html" class="nav-link">Login</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container mx-auto p-6 flex justify-center">
        <div class="w-full max-w-md bg-white rounded-lg shadow-md p-8">
            <h2 class="text-2xl font-bold text-amber-800 mb-6">Create New Account</h2>
            
            <form id="registerForm">
                <div class="mb-4">
                    <label class="block text-gray-700 mb-2" for="regUsername">Username</label>
                    <input type="text" id="regUsername" class="form-input" required>
                    <p class="text-xs text-gray-500 mt-1">This will be your display name</p>
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 mb-2" for="regEmail">Email (Gmail only)</label>
                    <input type="email" id="regEmail" class="form-input" required>
                    <p class="text-xs text-gray-500 mt-1">Only Gmail addresses are allowed</p>
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 mb-2" for="regPassword">Password</label>
                    <input type="password" id="regPassword" class="form-input" required>
                </div>
                <div class="mb-6">
                    <label class="block text-gray-700 mb-2" for="regConfirmPassword">Confirm Password</label>
                    <input type="password" id="regConfirmPassword" class="form-input" required>
                </div>
                <button type="submit" class="btn-primary w-full">
                    Register
                </button>
            </form>
            
            <div id="registerMessage" class="mt-4 text-center"></div>
            
            <div class="mt-6 text-center">
                <p class="text-gray-600">Already have an account? <a href="login.html" class="text-amber-700 hover:underline">Login here</a></p>
            </div>
        </div>
    </main>

    <footer class="bg-amber-900 text-white p-8">
        <div class="container mx-auto text-center">
            <p>&copy; 2023 Ferrero Restaurant. All rights reserved.</p>
        </div>
    </footer>
    <script src="./pages/auth.js"></script>
    <script src="./pages/register.js"></script>
</body>
</html>
